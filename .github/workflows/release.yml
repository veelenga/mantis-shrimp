name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test
        run: make test

      - name: Build DMG
        run: make dmg

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/MantisShrimp-$VERSION.dmg" \
            "build/MantisShrimp-$VERSION.dmg.sha256" \
            --title "MantisShrimp $VERSION" --generate-notes

      - name: Update Homebrew formula
        if: env.TAP_TOKEN != ''
        run: |
          sha=$(curl -sL "https://github.com/veelenga/mantis-shrimp/archive/refs/tags/$GITHUB_REF_NAME.tar.gz" | shasum -a 256 | cut -d' ' -f1)
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/veelenga/homebrew-tap.git" tap
          scripts/homebrew-formula.sh "$VERSION" "$sha" > tap/mantis-shrimp.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mantis-shrimp.rb
          git commit -m "Bump mantis-shrimp v$VERSION"
          git push
